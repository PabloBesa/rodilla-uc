<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario — Rotación Rodilla UC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a2744;
    --navy-mid: #243560;
    --gold: #c8973a;
    --gold-light: #e8c47a;
    --gold-pale: #f5e9cc;
    --cream: #faf8f3;
    --warm-gray: #f0ece3;
    --text: #2c2c2c;
    --text-muted: #5a5a5a;
    --border: #d4c9b0;
    --green: #2a6041;
    --green-light: #e8f2ec;
    --red-accent: #8b2e2e;
    --red-light: #f5eaea;
    --purple: #4a2a6b;
    --purple-light: #f0eaf8;
    --blue: #1a4a7a;
    --blue-light: #e8f0f8;
    --orange: #7a3a10;
    --orange-light: #f8ede8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Source Serif 4', Georgia, serif; background: var(--cream); color: var(--text); font-size: 15px; line-height: 1.75; }
  .page { max-width: 480px; margin: 0 auto; background: white; min-height: 100vh; }

  .header { background: var(--navy); padding: 32px 24px 24px; position: relative; overflow: hidden; }
  .header::after { content: ''; position: absolute; bottom: 0; right: 0; width: 160px; height: 100%; background: linear-gradient(135deg, transparent 50%, rgba(200,151,58,0.12) 100%); pointer-events: none; }
  .header-tag { font-size: 9px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: white; line-height: 1.2; margin-bottom: 6px; }
  .header h1 span { color: var(--gold-light); }
  .header-sub { font-size: 12px; color: rgba(255,255,255,0.6); font-style: italic; margin-top: 4px; }
  .gold-rule { width: 48px; height: 3px; background: var(--gold); margin: 14px 0 0; }

  .nav-bar { background: var(--navy-mid); padding: 10px 16px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .nav-bar::-webkit-scrollbar { display: none; }
  .nav-pill { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.8); border: none; border-radius: 20px; padding: 5px 12px; font-family: 'Source Serif 4', serif; font-size: 11px; white-space: nowrap; cursor: pointer; transition: background 0.2s; letter-spacing: 0.2px; }
  .nav-pill:hover, .nav-pill.active { background: var(--gold); color: var(--navy); font-weight: 600; }

  .content { padding: 20px 20px 60px; }
  .section { display: none; }
  .section.active { display: block; }
  .loading { padding: 40px 20px; text-align: center; color: var(--text-muted); font-style: italic; font-size: 13px; }

  /* MONTH GRID */
  .month-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 16px; }
  .day-header { font-size: 9px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); text-align: center; padding: 4px 2px 6px; border-bottom: 1.5px solid var(--border); }
  .cal-day { border: 1px solid var(--border); border-radius: 4px; padding: 4px; min-height: 72px; font-size: 9px; line-height: 1.35; background: white; }
  .cal-day.empty { background: var(--cream); border-color: transparent; }
  .cal-day.holiday { background: #f9f0e8; border-color: #e8d4b0; }
  .cal-day.switch-day { border: 1.5px dashed var(--gold); background: var(--gold-pale); }
  .day-num { font-family: 'Playfair Display', serif; font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 3px; display: block; }
  .cal-day.holiday .day-num { color: var(--orange); }

  .chip { display: block; border-radius: 3px; padding: 1px 4px; margin-bottom: 2px; font-size: 7.5px; font-weight: 600; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-feedback { background: var(--navy); color: var(--gold-light); }
  .chip-presentation { background: var(--purple-light); color: var(--purple); }
  .chip-holiday { background: #f0e4cc; color: var(--orange); }
  .chip-cristian, .chip-r0 { background: var(--gold-pale); color: #7a5010; }
  .chip-angela, .chip-r1 { background: var(--blue-light); color: var(--blue); }
  .chip-antonio, .chip-r2 { background: var(--green-light); color: var(--green); }
  .chip-r3 { background: var(--purple-light); color: var(--purple); }
  .chip-research { background: var(--warm-gray); color: var(--text-muted); }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding: 12px 14px; background: var(--warm-gray); border-radius: 8px; border: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--text); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1.5px solid var(--border); margin-top: 20px; }
  .section-header:first-child { margin-top: 0; }
  .section-num { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--gold); opacity: 0.7; line-height: 1; flex-shrink: 0; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 600; color: var(--navy); }
  .section-title em { display: block; font-family: 'Source Serif 4', serif; font-size: 10px; font-weight: 400; font-style: italic; color: var(--text-muted); margin-top: 1px; }

  .h-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; }
  .h1 { background: var(--navy); color: var(--gold-light); }
  .h2 { background: var(--gold); color: var(--navy); }

  .keydates { background: var(--warm-gray); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; margin-bottom: 16px; }
  .kd-row { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 11.5px; align-items: baseline; }
  .kd-row:last-child { border-bottom: none; }
  .kd-label { flex: 0 0 96px; font-weight: 700; color: var(--navy); }
  .kd-val { color: var(--text); }
  .intro-p { font-size: 12px; color: var(--text); line-height: 1.6; margin: 0 0 12px; }

  .footer { background: var(--warm-gray); border-top: 1px solid var(--border); padding: 16px 20px; text-align: center; font-size: 10.5px; color: var(--text-muted); font-style: italic; }
</style>
<body>
<div class="page">

  <div class="header">
    <div class="header-tag">Calendario de Rotación · Rodilla UC</div>
    <h1 id="headerMonth">Cargando…</h1>
    <p class="header-sub">Equipo de Cirugía de Rodilla — Ortopedia y Traumatología UC</p>
    <div class="gold-rule"></div>
    <p class="header-sub" style="margin-top:10px;">Dr. Pablo Besa · Dr. Cristián Ruz</p>
  </div>

  <div class="nav-bar" id="navBar">
    <button class="nav-pill active" onclick="show('general', this)">Inicio</button>
  </div>

  <div class="content" id="content">
    <div class="loading">Cargando calendario…</div>
  </div>

  <div class="footer">Equipo de Rodilla UC · calendario generado desde cohorte.json</div>

</div>
<script>
/* ================================================================
   Calendario — motor de generación
   Fuente de datos: cohorte.json (residentes, horarios, sesiones,
   fechas clave) + feriados de Chile vía api.boostr.cl (con respaldo
   estático si la consulta falla).
   ================================================================ */

const DIAS = ['lun', 'mar', 'mie', 'jue', 'vie'];
const DIAS_LABEL = { lun: 'Lun', mar: 'Mar', mie: 'Mié', jue: 'Jue', vie: 'Vie' };
const CHIP_CLASSES = ['chip-r0', 'chip-r1', 'chip-r2', 'chip-r3'];

const FERIADOS_RESPALDO_2026 = [
  { date: '2026-01-01', title: 'Año Nuevo' },
  { date: '2026-04-03', title: 'Viernes Santo' },
  { date: '2026-04-04', title: 'Sábado Santo' },
  { date: '2026-05-01', title: 'Día Nacional del Trabajo' },
  { date: '2026-05-21', title: 'Día de las Glorias Navales' },
  { date: '2026-06-21', title: 'Día Nacional de los Pueblos Indígenas' },
  { date: '2026-06-29', title: 'San Pedro y San Pablo' },
  { date: '2026-07-16', title: 'Día de la Virgen del Carmen' },
  { date: '2026-08-15', title: 'Asunción de la Virgen' },
  { date: '2026-09-18', title: 'Independencia Nacional' },
  { date: '2026-09-19', title: 'Día de las Glorias del Ejército' },
  { date: '2026-10-12', title: 'Encuentro de Dos Mundos' },
  { date: '2026-10-31', title: 'Día de las Iglesias Evangélicas y Protestantes' },
  { date: '2026-11-01', title: 'Día de Todos los Santos' },
  { date: '2026-12-08', title: 'Inmaculada Concepción' },
  { date: '2026-12-25', title: 'Navidad' }
];

function pad2(n) { return String(n).padStart(2, '0'); }
function isoDate(y, m, d) { return `${y}-${pad2(m)}-${pad2(d)}`; }
function fechaReunionInvestigacion(cohorte) {
  // Normalmente el primer martes del mes; usa reunion_investigacion_fecha en
  // cohorte.json si ese mes la reunión se mueve a otra fecha.
  if (cohorte.reunion_investigacion_fecha) return cohorte.reunion_investigacion_fecha;
  const primerDia = new Date(cohorte.anio, cohorte.mes_num - 1, 1);
  const offsetLunes = (primerDia.getDay() + 6) % 7;
  const primerMartes = offsetLunes <= 1 ? (2 - offsetLunes) : (9 - offsetLunes);
  return isoDate(cohorte.anio, cohorte.mes_num, primerMartes);
}
function firstNameInitial(nombreCompleto) {
  // "Dr. Raimundo Vial" -> "Dr. R. Vial" · "Dr. Besa" (ya corto) se deja igual
  const partes = nombreCompleto.trim().split(/\s+/);
  if (partes.length === 3) return `${partes[0]} ${partes[1][0]}. ${partes[2]}`;
  return nombreCompleto;
}
function slugResidente(nombre) {
  return nombre.trim().split(/\s+/)[0]
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase();
}

async function cargarFeriados(anio) {
  try {
    const res = await fetch(`https://api.boostr.cl/holidays/${anio}.json`, { cache: 'no-store' });
    const json = await res.json();
    if (json && json.status === 'success' && Array.isArray(json.data)) {
      const map = new Map();
      json.data.forEach(f => map.set(f.date, f.title));
      return map;
    }
    throw new Error('formato inesperado');
  } catch (e) {
    const map = new Map();
    FERIADOS_RESPALDO_2026.forEach(f => map.set(f.date, f.title));
    return map;
  }
}

function horaConOffset(horaBase, indice, minutosPaso) {
  const [h, m] = horaBase.split(':').map(Number);
  const total = h * 60 + m + indice * minutosPaso;
  return `${pad2(Math.floor(total / 60))}:${pad2(total % 60)}`;
}

function construirGrid(cohorte, feriados, residente, chipClass) {
  const [anio, mesNum] = [cohorte.anio, cohorte.mes_num];
  const ultimoDia = new Date(anio, mesNum, 0).getDate();
  const primerDia = new Date(anio, mesNum - 1, 1);
  const primerDiaSemana = (primerDia.getDay() + 6) % 7; // 0=lun ... 6=dom

  let html = '<div class="month-grid">';
  DIAS.forEach(d => { html += `<div class="day-header">${DIAS_LABEL[d]}</div>`; });

  if (primerDiaSemana < 5) {
    for (let i = 0; i < primerDiaSemana; i++) html += '<div class="cal-day empty"></div>';
  }

  const cambio = cohorte.cambio_horario_fecha;
  const otroHorario = residente.horario_inicial === 'H1' ? 'H2' : 'H1';
  const reunionFecha = fechaReunionInvestigacion(cohorte);

  for (let d = 1; d <= ultimoDia; d++) {
    const fecha = new Date(anio, mesNum - 1, d);
    const diaSemana = (fecha.getDay() + 6) % 7;
    if (diaSemana > 4) continue; // fin de semana, no se muestra

    const fechaISO = isoDate(anio, mesNum, d);
    const esCambio = fechaISO === cambio;
    const horarioActivo = fechaISO < cambio ? residente.horario_inicial : otroHorario;
    const clave = DIAS[diaSemana];
    const ubicacion = cohorte.horarios[horarioActivo][clave];

    const feriadoTitulo = feriados.get(fechaISO);
    const chips = [];
    const clases = ['cal-day'];

    if (feriadoTitulo) {
      clases.push('holiday');
      chips.push(`<span class="chip chip-holiday">Feriado</span>`);
      chips.push(`<span class="chip chip-holiday">${feriadoTitulo}</span>`);
    } else {
      chips.push(`<span class="chip ${chipClass}">${horarioActivo} · ${ubicacion.short}</span>`);
      if (esCambio) clases.push('switch-day');
      if (esCambio) chips.push(`<span class="chip chip-feedback">&harr; Cambio a ${horarioActivo}</span>`);
      if (fechaISO === reunionFecha) chips.push(`<span class="chip chip-research">Reunión investig.</span>`);
      if (residente.presentacion && residente.presentacion.fecha === fechaISO) {
        chips.push(`<span class="chip chip-presentation">Present. · ${firstNameInitial(residente.presentacion.tutor)}</span>`);
      }
      if (cohorte.sesiones.mitad_fecha === fechaISO || cohorte.sesiones.final_fecha === fechaISO) {
        chips.push(`<span class="chip chip-feedback">Feedback ${residente._horaFeedback}</span>`);
      }
    }

    html += `<div class="${clases.join(' ')}"><span class="day-num">${d}</span>${chips.join('')}</div>`;
  }
  html += '</div>';
  return html;
}

function construirReferenciaHorarios(cohorte) {
  const linea = (h) => DIAS.map(d => `${DIAS_LABEL[d]}: ${cohorte.horarios[h][d].full}`).join(' · ');
  return `
    <div class="section-header"><div class="section-num">&middot;</div><div class="section-title">&iquest;Qu&eacute; es cada horario?<em>Referencia de tus turnos</em></div></div>
    <div class="keydates">
      <div class="kd-row"><span class="kd-label"><span class="h-badge h1">Horario 1</span></span><span class="kd-val">${linea('H1')}</span></div>
      <div class="kd-row"><span class="kd-label"><span class="h-badge h2">Horario 2</span></span><span class="kd-val">${linea('H2')}</span></div>
    </div>`;
}

function fechaCorta(fechaISO) {
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const DIAS_L = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
  const [y, m, d] = fechaISO.split('-').map(Number);
  const fecha = new Date(y, m - 1, d);
  return `${DIAS_L[fecha.getDay()]} ${d} ${MESES[m - 1]}`;
}

function construirSeccionGeneral(cohorte, feriados) {
  const feriadosDelMes = [...feriados.entries()]
    .filter(([fecha]) => fecha.startsWith(`${cohorte.anio}-${pad2(cohorte.mes_num)}`));

  let equipoRows = `<div class="kd-row"><span class="kd-label">Cambio horario</span><span class="kd-val">${fechaCorta(cohorte.cambio_horario_fecha)} — todos cambian de track</span></div>`;
  feriadosDelMes.forEach(([fecha, titulo]) => {
    equipoRows += `<div class="kd-row"><span class="kd-label">Feriado</span><span class="kd-val">${fechaCorta(fecha)} — ${titulo}</span></div>`;
  });
  equipoRows += `<div class="kd-row"><span class="kd-label">Reunión equipo</span><span class="kd-val">${fechaCorta(fechaReunionInvestigacion(cohorte))} — reunión de investigación (sin presentaciones ese día)</span></div>`;
  (cohorte.eventos_equipo || []).forEach(ev => {
    equipoRows += `<div class="kd-row"><span class="kd-label">${ev.etiqueta || 'Aviso'}</span><span class="kd-val">${ev.texto}</span></div>`;
  });

  let presentRows = '';
  cohorte.residentes.forEach(r => {
    if (!r.presentacion) return;
    presentRows += `<div class="kd-row"><span class="kd-label">${r.nombre.split(' ')[0]} · ${r.anio}</span><span class="kd-val">${fechaCorta(r.presentacion.fecha).split(' ').slice(1).join(' ')} — ${r.presentacion.tutor}</span></div>`;
  });

  return `
    <div class="section-header"><div class="section-num">&middot;</div><div class="section-title">C&oacute;mo usar este calendario<em>${cohorte.mes}</em></div></div>
    <p class="intro-p">Cada residente tiene su propia pesta&ntilde;a arriba con su calendario del mes. Abre la tuya y revisa lo que te toca:</p>
    <div class="keydates">
      <div class="kd-row"><span class="kd-label">Rotaci&oacute;n</span><span class="kd-val">Qu&eacute; horario te toca y cu&aacute;ndo cambias de track</span></div>
      <div class="kd-row"><span class="kd-label">D&iacute;a a d&iacute;a</span><span class="kd-val">D&oacute;nde est&aacute;s cada d&iacute;a (pabell&oacute;n, policl&iacute;nico, cuenta)</span></div>
      <div class="kd-row"><span class="kd-label">Feedback</span><span class="kd-val">Tu d&iacute;a y hora de feedback</span></div>
      <div class="kd-row"><span class="kd-label">Presentaci&oacute;n</span><span class="kd-val">Tu fecha de presentaci&oacute;n y tu tutor</span></div>
    </div>

    <div class="section-header"><div class="section-num">&middot;</div><div class="section-title">Fechas del equipo<em>v&aacute;lidas para todos</em></div></div>
    <div class="keydates">${equipoRows}</div>

    <div class="section-header"><div class="section-num">&middot;</div><div class="section-title">Presentaciones<em>d&iacute;a y tutor</em></div></div>
    <div class="keydates">${presentRows}</div>`;
}

function construirSeccionResidente(cohorte, feriados, residente, idx) {
  const chipClass = CHIP_CLASSES[idx % CHIP_CLASSES.length];
  const horaMitad = horaConOffset(cohorte.sesiones.hora_base, idx, 20);
  residente._horaFeedback = horaMitad;

  const otroHorario = residente.horario_inicial === 'H1' ? 'H2' : 'H1';
  const presentTxt = residente.presentacion
    ? `${fechaCorta(residente.presentacion.fecha)} &middot; Reuni&oacute;n Equipo &middot; Tutor ${residente.presentacion.tutor}`
    : 'Por confirmar';

  return `
    <div class="section-header"><div class="section-num">${pad2(idx + 1)}</div><div class="section-title">${residente.nombre} &middot; ${residente.anio}<em>Tu rotaci&oacute;n de ${cohorte.mes.split(' ')[0].toLowerCase()}</em></div></div>
    <div class="keydates">
      <div class="kd-row"><span class="kd-label">Rotaci&oacute;n</span><span class="kd-val">Horario ${residente.horario_inicial.slice(1)} (hasta ${fechaCorta(cohorte.cambio_horario_fecha).split(' ').slice(1).join(' ')}) &rarr; Horario ${otroHorario.slice(1)} (desde ${fechaCorta(cohorte.cambio_horario_fecha)})</span></div>
      <div class="kd-row"><span class="kd-label">Presentaci&oacute;n</span><span class="kd-val">${presentTxt}</span></div>
      <div class="kd-row"><span class="kd-label">Feedback</span><span class="kd-val">${cohorte.sesiones.mitad_fecha ? fechaCorta(cohorte.sesiones.mitad_fecha) + ' (mitad) y ' : ''}${fechaCorta(cohorte.sesiones.final_fecha)} (final) &middot; ${horaMitad} hrs</span></div>
      <div class="kd-row"><span class="kd-label">Pautas</span><span class="kd-val">2 pabell&oacute;n &middot; 2 policl&iacute;nico &middot; visitas &middot; presentaci&oacute;n — coordina con los evaluadores durante el mes</span></div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--${idx === 0 ? 'gold-pale' : idx === 1 ? 'blue-light' : idx === 2 ? 'green-light' : 'purple-light'})"></div>Su jornada</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--purple-light)"></div>Presentaci&oacute;n</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--navy)"></div>Feedback / Cambio</div>
      <div class="legend-item"><div class="legend-dot" style="background:#f0e4cc"></div>Feriado</div>
    </div>
    ${construirGrid(cohorte, feriados, residente, chipClass)}
    ${construirReferenciaHorarios(cohorte)}`;
}

async function iniciar() {
  let cohorte;
  try {
    const res = await fetch('cohorte.json?t=' + Date.now(), { cache: 'no-store' });
    cohorte = await res.json();
  } catch (e) {
    document.getElementById('content').innerHTML =
      '<div class="loading">No se pudo cargar cohorte.json. Revisa tu conexi&oacute;n y vuelve a intentar.</div>';
    return;
  }

  const feriados = await cargarFeriados(cohorte.anio);

  const [mesNombre, anioTxt] = cohorte.mes.split(' ');
  document.getElementById('headerMonth').innerHTML = `${mesNombre} <span>${anioTxt}</span>`;
  document.title = `Calendario ${cohorte.mes} — Rotación Rodilla UC`;

  const navBar = document.getElementById('navBar');
  const content = document.getElementById('content');

  let navHtml = '<button class="nav-pill active" onclick="show(\'general\', this)">Inicio</button>';
  let contentHtml = `<div class="section active" id="sec-general">${construirSeccionGeneral(cohorte, feriados)}</div>`;

  cohorte.residentes.forEach((r, idx) => {
    const slug = slugResidente(r.nombre);
    navHtml += `<button class="nav-pill" onclick="show('${slug}', this)">${r.nombre.split(' ')[0]}</button>`;
    contentHtml += `<div class="section" id="sec-${slug}">${construirSeccionResidente(cohorte, feriados, r, idx)}</div>`;
  });

  navBar.innerHTML = navHtml;
  content.innerHTML = contentHtml;
}

function show(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
  document.getElementById('sec-' + id).classList.add('active');
  btn.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

iniciar();
</script>
